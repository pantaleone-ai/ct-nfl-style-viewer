    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        /* Custom styles for better UI */
        .team-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .team-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .color-swatch {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        /* Custom tooltip for "Copied!" */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 100px;
            background-color: #059669; /* Green */
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -50px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #059669 transparent transparent transparent;
        }
        .tooltip.show .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>

        // --- App Logic ---

        /**
         * Renders the team cards to the grid
         * @param {Array} teams - An array of team objects to render
         */
        function renderTeams(teams) {
            teamGrid.innerHTML = ''; // Clear existing grid
            
            if (teams.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }

            teams.forEach(team => {
                const card = document.createElement('div');
                card.className = 'team-card bg-white rounded-lg shadow-md overflow-hidden p-6';
                
                // --- Generate Color Swatches HTML ---
                const colorSwatchesHTML = team.colors.map(color => {
                    // Handle white swatch visibility
                    const borderClass = color.hex === '#FFFFFF' ? 'border-2 border-gray-200' : '';
                    return `
                        <div class="text-center">
                            <div class="color-swatch mx-auto ${borderClass}" style="background-color: ${color.hex};"></div>
                            <p class="mt-2 text-sm font-semibold text-gray-800">${color.name}</p>
                            <div class="tooltip" onclick="copyToClipboard('${color.hex}', this)">
                                <span class="tooltiptext">Copied!</span>
                                <p class="text-xs text-gray-600 cursor-pointer hover:text-blue-600 font-mono">${color.hex}</p>
                            </div>
                            <p class="text-xs text-gray-500 font-mono">RGB: ${color.rgb}</p>
                            <p class="text-xs text-gray-500">PMS: ${color.pantone}</p>
                        </div>
                    `;
                }).join('');
                
                // Get logo placeholder colors
                const logoColor1 = team.colors[0]?.hex.substring(1) || '000000';
                const logoColor2 = team.colors[1]?.hex.substring(1) || 'FFFFFF';

                // --- Generate Card HTML ---
                card.innerHTML = `
                    <div class="flex items-center mb-4">
                        <img src="https://placehold.co/64x64/${logoColor1}/${logoColor2}?text=${team.initials}&font=inter" 
                             alt="${team.teamName} logo placeholder" 
                             class="w-16 h-16 rounded-full mr-4 border-2 border-gray-100">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">${team.teamName}</h2>
                            <p class="text-sm text-gray-500">${team.conference} ${team.division}</p>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Color Palette</h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            ${colorSwatchesHTML}
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-2">Typography</h3>
                        <p class="text-base text-gray-800">${team.font}</p>
                    </div>
                `;
                
                teamGrid.appendChild(card);
            });
        }

        /**
         * Filters the teams based on current filter values and re-renders the grid
         */
        function filterAndRender() {
            const confValue = conferenceFilter.value;
            const divValue = divisionFilter.value;
            const searchValue = searchFilter.value.toLowerCase();

            const filteredTeams = teamData.filter(team => {
                const matchesConf = (confValue === 'all') || (team.conference === confValue);
                const matchesDiv = (divValue === 'all') || (team.division === divValue);
                const matchesSearch = team.teamName.toLowerCase().includes(searchValue);
                
                return matchesConf && matchesDiv && matchesSearch;
            });

            renderTeams(filteredTeams);
        }

        /**
         * Copies text to clipboard and shows a "Copied!" tooltip
         * @param {string} text - The text to copy
         * @param {HTMLElement} element - The tooltip container element
         */
        function copyToClipboard(text, element) {
            // Create a temporary textarea to execute the copy command
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Prevent scrolling to bottom
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                // Show tooltip
                element.classList.add('show');
                setTimeout(() => {
                    element.classList.remove('show');
                }, 1500);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
            
            document.body.removeChild(textarea);
        }

        // --- Initial Load and Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            renderTeams(teamData);
            
            // Add event listeners to filters
            conferenceFilter.addEventListener('change', filterAndRender);
            divisionFilter.addEventListener('change', filterAndRender);
            searchFilter.addEventListener('input', filterAndRender);
        });
